<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />

    <title>Edit Library app</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="/">Book Library app</a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarText"
        aria-controls="navbarText"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active">
            <a class="nav-link" href="/"
              >Home <span class="sr-only">(current)</span></a
            >
          </li>
        </ul>
      </div>
    </nav>

    <div class="container">
      <h4 class="mt-3">Edit Book</h4>
      <form class="mt-4" method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label for="Title">Title</label>
          <input
            type="text"
            class="form-control"
            id="title"
            aria-describedby="emailHelp"
            placeholder="Enter Title of the Book"
            name="title"
            value="{{book.title}}"
          />
        </div>

        <div class="form-group">
          <label for="author">Author</label>
          <input
            type="text"
            class="form-control"
            id="exampleInputEmail1"
            aria-describedby="emailHelp"
            placeholder="Enter Title of the Author"
            name="author"
            value="{{book.author}}"
          />
        </div>
        <div class="form-group">
          <label for="image_address">Book Image Address</label>
          <input
            type="url"
            class="form-control"
            aria-describedby="emailHelp"
            placeholder="Past Book Image Address"
            name="image_address"
            value="{{book.image_address}}"
          />
        </div>

        <div class="form-group">
          <label for="isbn">ISBN</label>
          <input
            type="text"
            class="form-control"
            id="isbn"
            aria-describedby="emailHelp"
            placeholder="What is the the book ISBN"
            name="isbn"
            value="{{ book.isbn }}"
          />

          <div class="form-group">
            <label for="publishe_Date">Publishe_Date</label>
            <input type="date" class="form-control" id="title"
            aria-describedby="emailHelp" placeholder="Enter publishe_Date of the
            Book" name="date" value="{{ book.published_Date |default:"" }}" />
          </div>
          <div class="form-group">
            <label for="Copies_available">Number of Copies_available</label>
            <input
              type="Number"
              class="form-control"
              id="Copies_available"
              aria-describedby="emailHelp"
              placeholder="Number of Copies_available"
              name="Copies_available"
              value="{{ book.Copies_available }}"
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
      </form>

      <br />
    </div>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
